include: package:flutter_lints/flutter.yaml

# Note: unused_import / unused_local_variable / unused_element are not lint
# rules — they're built-in analyzer diagnostics, enabled by default. Listing
# them under `linter.rules` emits a warning (`undefined_lint`).
linter:
  rules:
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - await_only_futures
    - unawaited_futures
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - use_key_in_widget_constructors

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
  errors:
    invalid_annotation_target: ignore
