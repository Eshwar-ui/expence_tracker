name: expence_tracker
description: "Premium personal finance and expense tracker with smart OCR, UPI integration, and biometric security."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  intl: ^0.19.0

  # Firebase dependencies
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.0.0
  firebase_crashlytics: ^4.3.5
  google_sign_in: ^6.3.0

  # SMS and permissions
  another_telephony: ^0.4.1
  permission_handler: ^11.4.0

  # Charts and UI elements
  fl_chart: ^0.68.0
  google_fonts: ^6.3.3
  flutter_svg: ^2.2.3
  mobile_scanner: ^5.2.3
  url_launcher: ^6.3.0

  # UPI payment integration
  flutter_upi_india: ^1.0.1

  # AI and Local Auth
  tflite_flutter: ^0.11.0
  local_auth: ^3.0.0
  flutter_secure_storage: ^9.2.2
  
  # HTTP and Environment Variables
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  home_widget: ^0.9.0

  # Local notification channel for FCM daily expense reminder
  flutter_local_notifications: ^17.2.3

  # CSV / PDF export + sharing
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # Voice quick-add (mic → text → parsed transaction)
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/income_arrow.svg
    - assets/expense_arrow.svg
    - assets/models/
    - assets/animations/
    - .env

# App launcher icon configuration
flutter_launcher_icons:
  android: "dark_app_icon"
  ios: false
  image_path: "assets/dark_app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/App_logo.png"
    background_color: "#0F0F23"
    theme_color: "#6366F1"
